<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SYRIX FLIX — Connexion</title>
<link rel="stylesheet" href="assets/css/site.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="sf-app">
  <div class="sf-auth-wrap">
    <span class="sf-logo sf-logo--lg">
      <span class="sf-logo__mark">S</span>
      <span class="sf-logo__text"><span>SYRIX</span><span class="sf-flix">FLIX</span></span>
    </span>
    <h1>Connexion</h1>

    <form id="loginForm">
      <div class="sf-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Entrez votre e-mail" required autocomplete="email" />
      </div>
      <div class="sf-field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required autocomplete="current-password" />
        <button type="button" class="sf-field__toggle" data-toggle="password">👁</button>
      </div>

      <p class="sf-error" id="loginError" style="display:none;"></p>

      <button type="submit" class="sf-btn-block" id="loginSubmit">SE CONNECTER</button>
    </form>

    <p class="sf-subtext"><a href="#">Mot de passe oublié ?</a></p>
    <p class="sf-subtext">Pas encore de compte ? <a href="signup.html">S'inscrire</a></p>
  </div>

  <script src="assets/js/app-common.js"></script>
  <script>
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.toggle);
        input.type = input.type === "password" ? "text" : "password";
      });
    });

    // Déjà connecté ? On saute directement à l'accueil.
    if (SyrixAuth.getToken()) window.location.href = "accueil.html";

    const form = document.getElementById("loginForm");
    const errorEl = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "CONNEXION...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const res = await SyrixAuth.api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });

      if (res.success) {
        SyrixAuth.setSession(res.data.token, res.data.user);
        window.location.href = "accueil.html";
      } else {
        errorEl.textContent = res.error?.message || "Connexion impossible.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "SE CONNECTER";
      }
    });
  </script>
</body>
</html>
