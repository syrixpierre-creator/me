<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond cinématographique -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f070a"/>
      <stop offset="60%" stop-color="#0e0507"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Dégradés rouge Netflix et ruban rubis -->
    <linearGradient id="redRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a38"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#99030b"/>
    </linearGradient>

    <linearGradient id="redRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4452"/>
      <stop offset="45%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#730208"/>
    </linearGradient>

    <linearGradient id="redRibbon3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b80710"/>
      <stop offset="60%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff3b47"/>
    </linearGradient>

    <!-- Reflet lumière blanche chrome -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Filtre de lueur cinéma -->
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Arrière-plan avec coins arrondis style App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(229, 9, 20, 0.25)" stroke-width="2"/>

  <!-- Halo rouge central -->
  <circle cx="256" cy="256" r="160" fill="#e50914" opacity="0.12" filter="blur(40px)"/>

  <!-- Emblème "S" cinématographique sculpté en rubans 3D -->
  <g filter="url(#subtleShadow)">
    <!-- Branche supérieure du S (courbe vers la droite) -->
    <path d="M 370 148 C 370 110 320 88 256 88 C 178 88 140 126 142 186 C 144 238 186 264 252 284 L 286 294 C 336 308 360 328 358 368 C 356 414 316 438 254 438 C 176 438 132 402 134 348 L 194 344 C 194 374 218 392 254 392 C 290 392 312 376 314 354 C 316 328 292 312 248 298 L 214 288 C 158 270 100 240 98 174 C 96 104 154 52 256 52 C 354 52 414 100 414 162 Z"
          fill="url(#redRibbon1)"/>

    <!-- Bandeau diagonal d'ombre & de profondeur -->
    <path d="M 214 288 L 252 284 C 292 296 322 308 340 332 L 358 368 C 342 340 310 322 268 308 Z" 
          fill="#400205" opacity="0.65"/>

    <!-- Lignes d'accent lumineuses -->
    <path d="M 256 62 C 342 62 396 102 398 154 L 382 156 C 380 114 336 78 256 78 C 188 78 152 110 150 162 L 136 160 C 138 98 184 62 256 62 Z" 
          fill="url(#sheen)"/>

    <!-- Éclat cinématique supérieur -->
    <circle cx="370" cy="148" r="4" fill="#ffffff" opacity="0.9" filter="url(#cinematicGlow)"/>
  </g>

  <!-- Tagline Ultra HD minimaliste -->
  <g transform="translate(256, 466)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text y="0" font-size="20" font-weight="900" letter-spacing="8" fill="#e50914">CINEMA</text>
  </g>
</svg>
