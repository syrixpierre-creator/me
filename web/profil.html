<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SYRIX FLIX — Profil</title>
<link rel="stylesheet" href="assets/css/site.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="sf-app">
  <div class="sf-topbar">
    <button class="sf-topbar__back" onclick="window.location.href='accueil.html'">←</button>
    <h1 class="sf-topbar__title">Profil</h1>
  </div>

  <div class="sf-profile-head">
    <div class="sf-avatar">👤</div>
    <h3 id="pUsername">—</h3>
    <p id="pEmail">—</p>
  </div>

  <div class="sf-badges">
    <span class="sf-badge">❤ Favoris (<span id="pFavCount">0</span>)</span>
    <span class="sf-badge">⬇ Téléchargements (<span id="pDlCount">0</span>)</span>
  </div>

  <div class="sf-profile-body">
    <h4>Informations</h4>
    <div class="sf-info-row"><span>Membre depuis</span><span id="pCreatedAt">—</span></div>
    <div class="sf-info-row"><span>Thème</span><span id="pTheme">dark</span></div>

    <div style="height:24px"></div>
    <h4>Clé API Développeur</h4>
    <div class="sf-card" id="apiKeyCard">
      <p class="sf-hint">Chargement…</p>
    </div>
  </div>

  <script src="assets/js/app-common.js"></script>
  <script>
    SyrixAuth.requireAuth();

    let generatedKey = null;

    function renderApiKeyCard(profile) {
      const card = document.getElementById("apiKeyCard");
      const hasKey = profile.hasApiKey;
      const actionLabel = hasKey ? "RÉGÉNÉRER LA CLÉ API" : "GÉNÉRER UNE CLÉ API";

      card.innerHTML = `
        ${hasKey ? `
          <div class="sf-keyrow">
            <code id="apiKeyValue">${generatedKey ? generatedKey : "syrix~•••••••••••••••••••••• (masquée)"}</code>
            ${generatedKey ? `<button id="copyKeyBtn" title="Copier">⧉</button>` : ""}
          </div>
          <p class="sf-hint" style="margin-top:8px;">
            ${profile.apiKeyName ? "Nom : " + profile.apiKeyName + " — " : ""}
            ${profile.apiKeyDomain ? "Verrouillée sur : " + profile.apiKeyDomain : "Pas encore verrouillée — sera fixée au premier appel entrant."}
          </p>
        ` : `
          <p class="sf-hint">Aucune clé pour l'instant. Générez-en une si vous êtes développeur —
          elle se verrouille sur le domaine de votre site (auto-détecté au premier appel, ou renseigné ci-dessous).</p>
        `}
        <div class="sf-field" style="margin-bottom:12px; margin-top:12px;">
          <label>Nom de la clé (optionnel)</label>
          <input type="text" id="apiName" placeholder="ex: Site movie-syrix" value="${hasKey && profile.apiKeyName ? profile.apiKeyName : ""}" />
        </div>
        <div class="sf-field" style="margin-bottom:12px;">
          <label>Domaine autorisé (optionnel)</label>
          <input type="text" id="apiDomain" placeholder="ex: movie.votresite.com" value="${hasKey && profile.apiKeyDomain ? profile.apiKeyDomain : ""}" />
        </div>
        <button class="sf-btn-block" id="genKeyBtn">${actionLabel}</button>
        ${hasKey ? `<button class="sf-btn-block sf-btn-block--outline" id="revokeKeyBtn" style="margin-top:8px;">RÉVOQUER LA CLÉ</button>` : ""}
      `;

      document.getElementById("genKeyBtn").addEventListener("click", async () => {
        if (hasKey && !confirm("Régénérer la clé invalide immédiatement l'ancienne. Continuer ?")) return;
        const btn = document.getElementById("genKeyBtn");
        btn.disabled = true;
        btn.textContent = hasKey ? "RÉGÉNÉRATION..." : "GÉNÉRATION...";
        const name = document.getElementById("apiName").value.trim();
        const domain = document.getElementById("apiDomain").value.trim();
        const res = await SyrixAuth.api("/profile/api-key", {
          method: "POST",
          body: JSON.stringify({ name, domain }),
        });
        if (res.success) {
          generatedKey = res.data.apiKey;
          await load();
        } else {
          alert(res.error?.message || "Échec de la génération.");
          btn.disabled = false;
          btn.textContent = actionLabel;
        }
      });

      if (generatedKey) {
        document.getElementById("copyKeyBtn")?.addEventListener("click", () => {
          navigator.clipboard.writeText(generatedKey);
          alert("Clé copiée.");
        });
      }

      document.getElementById("revokeKeyBtn")?.addEventListener("click", async () => {
        if (!confirm("Révoquer définitivement la clé API ?")) return;
        const res = await SyrixAuth.api("/profile/api-key", { method: "DELETE" });
        if (res.success) {
          generatedKey = null;
          await load();
        }
      });
    }

    async function load() {
      const res = await SyrixAuth.api("/profile");
      if (!res.success) return;
      const p = res.data;
      SyrixAuth.setSession(SyrixAuth.getToken(), p);
      document.getElementById("pUsername").textContent = p.username;
      document.getElementById("pEmail").textContent = p.email;
      document.getElementById("pFavCount").textContent = p.favoritesCount || 0;
      document.getElementById("pDlCount").textContent = p.downloadsCount || 0;
      document.getElementById("pCreatedAt").textContent = p.createdAt ? p.createdAt.substring(0, 10) : "—";
      document.getElementById("pTheme").textContent = p.theme || "dark";
      renderApiKeyCard(p);
    }
    load();
  </script>
</body>
</html>
