<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SYRIX FLIX — Détails</title>
<link rel="stylesheet" href="assets/css/site.css" />
<link rel="stylesheet" href="assets/css/app.css" />
<style>
  .sf-detail-hero {
    position: relative; width: 100%; min-height: 280px; max-height: 420px;
    background-size: cover; background-position: center top;
    background-color: #141414; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 24px 20px;
  }
  .sf-detail-hero::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,20,20,0.2) 0%, rgba(20,20,20,0.8) 70%, #141414 100%);
  }
  .sf-detail-hero-content { position: relative; z-index: 2; max-width: 800px; }

  .sf-detail-title {
    font-size: 28px; font-weight: 900; margin: 0 0 10px; line-height: 1.15;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .sf-detail-tags {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
    font-size: 13px; font-weight: 600;
  }
  .sf-tag-match { color: #46d369; font-weight: 700; }
  .sf-tag-pill {
    padding: 3px 8px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
    font-size: 11px; color: rgba(255,255,255,0.8);
  }
  .sf-tag-hd { background: rgba(229,9,20,0.2); border-color: var(--sf-accent); color: #fff; }

  /* Bouton d'action principal style Netflix */
  .sf-netflix-play-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: #FFFFFF; color: #000000; font-weight: 800; font-size: 16px;
    padding: 12px 28px; border-radius: 6px; border: none; cursor: pointer;
    transition: background 0.2s, transform 0.15s; margin-top: 6px;
  }
  .sf-netflix-play-btn:hover { background: rgba(255,255,255,0.85); transform: scale(1.02); }
  .sf-netflix-play-btn:active { transform: scale(0.98); }

  .sf-detail-container { padding: 20px 20px 60px; max-width: 1000px; margin: 0 auto; }
  .sf-synopsis {
    font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.85); margin-bottom: 28px;
    max-width: 750px;
  }

  /* Section Épisodes */
  .sf-episodes-section { margin-top: 30px; }
  .sf-section-heading { font-size: 18px; font-weight: 800; margin: 0 0 16px; color: #fff; }
  .sf-episode-grid { display: flex; flex-direction: column; gap: 8px; }
  .sf-episode-card {
    display: flex; align-items: center; gap: 16px; padding: 14px 18px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--sf-border);
    border-radius: 8px; cursor: pointer; transition: background 0.2s, border-color 0.2s;
    text-align: left; width: 100%; color: #fff; font-family: inherit;
  }
  .sf-episode-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); }
  .sf-episode-card i { color: var(--sf-accent); flex-shrink: 0; }
  .sf-episode-card .title { font-size: 14px; font-weight: 600; flex: 1; }
  .sf-episode-card .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 12px;
    background: rgba(229,9,20,0.15); color: var(--sf-accent); font-weight: 700;
  }

  /* Casting & Personnages */
  .sf-characters-section { margin-top: 36px; }
  .sf-characters-scroll {
    display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none;
  }
  .sf-characters-scroll::-webkit-scrollbar { display: none; }
  .sf-char-card {
    width: 100px; flex-shrink: 0; text-align: center;
  }
  .sf-char-photo {
    width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
    margin: 0 auto 8px; background: #222; border: 2px solid var(--sf-border);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .sf-char-photo img { width: 100%; height: 100%; object-fit: cover; }
  .sf-char-name { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.2; }
  .sf-char-role { font-size: 11px; color: var(--sf-muted); margin-top: 2px; }
</style>
</head>
<body class="sf-app">
  <!-- Topbar sans emoji -->
  <div class="sf-topbar">
    <button class="sf-topbar__back" id="backBtn" onclick="history.length > 1 ? history.back() : (window.location.href = 'accueil.html')">
      <!-- SVG Flèche retour -->
    </button>
    <h1 class="sf-topbar__title" id="pageTitle">Détails</h1>
  </div>

  <!-- Zone du Lecteur Vidéo Netflix -->
  <div id="playerZone"></div>

  <!-- Bannière Hero Backdrop -->
  <div class="sf-detail-hero" id="heroBanner">
    <div class="sf-detail-hero-content" id="heroContent">
      <h2 class="sf-detail-title" id="detailTitle">Chargement...</h2>
      <div class="sf-detail-tags" id="detailTags"></div>
      <div id="heroAction"></div>
    </div>
  </div>

  <div class="sf-detail-container">
    <p class="sf-synopsis" id="detailSynopsis"></p>

    <!-- Épisodes si série ou anime -->
    <div class="sf-episodes-section" id="episodesSection" style="display:none;">
      <h3 class="sf-section-heading">Épisodes disponibles</h3>
      <div class="sf-episode-grid" id="episodesList"></div>
    </div>

    <!-- Casting & Personnages (Recherche publique enrichie) -->
    <div class="sf-characters-section" id="charactersSection" style="display:none;">
      <h3 class="sf-section-heading">Personnages &amp; Distribution</h3>
      <div class="sf-characters-scroll" id="charactersList"></div>
    </div>
  </div>

  <script src="assets/js/app-common.js"></script>
  <script>
    SyrixAuth.requireAuth();

    // Remplacement des icônes SVG dans le header
    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.innerHTML = sfIcon("arrowLeft", 20);

    const params = new URLSearchParams(window.location.search);
    const type = params.get("type"); // 'movie' | 'series' | 'anime' | 'drama'
    const slug = params.get("slug");

    function routeType(t) {
      if (t === "movie") return "movies";
      if (t === "drama") return "dramas";
      return t;
    }

    let mediaDetail = null;

    // --- Lancement direct du film sans afficher de liste de serveurs ---
    async function playMovieNow() {
      if (!mediaDetail || !mediaDetail.first_episode_id) {
        alert("Aucun flux disponible pour ce titre.");
        return;
      }
      const zone = document.getElementById("playerZone");
      zone.innerHTML = `<div class="sf-placeholder"><div class="sf-spinner"></div><p>Recherche du meilleur serveur...</p></div>`;
      zone.scrollIntoView({ behavior: "smooth", block: "start" });

      const res = await SyrixAuth.api("/episodes/" + encodeURIComponent(mediaDetail.first_episode_id) + "/servers");
      const servers = res.success ? (res.data || []) : [];
      if (!servers.length) {
        zone.innerHTML = `<div class="sf-placeholder"><p>Désolé, aucun serveur actif n'a pu être contacté.</p></div>`;
        return;
      }
      SyrixStreamPlayer.launchStream(zone, mediaDetail.title, "Film complet", servers);
    }

    // --- Lancement direct d'un épisode sans liste de serveurs ---
    async function playEpisodeNow(epId, epTitle) {
      const zone = document.getElementById("playerZone");
      zone.innerHTML = `<div class="sf-placeholder"><div class="sf-spinner"></div><p>Connexion au serveur haute vitesse...</p></div>`;
      zone.scrollIntoView({ behavior: "smooth", block: "start" });

      let res;
      if (type === "series") {
        res = await SyrixAuth.api("/episodes/" + encodeURIComponent(epId) + "/servers");
      } else {
        res = await SyrixAuth.api("/" + routeType(type) + "/" + encodeURIComponent(slug) + "/servers?episode=" + encodeURIComponent(epId));
      }

      const servers = res.success ? (res.data || []) : [];
      if (!servers.length) {
        zone.innerHTML = `<div class="sf-placeholder"><p>Aucun serveur en ligne pour cet épisode.</p></div>`;
        return;
      }
      SyrixStreamPlayer.launchStream(zone, mediaDetail.title, epTitle, servers);
    }

    function renderPage(detail) {
      mediaDetail = detail;
      const title = detail.title || "Titre inconnu";
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("detailTitle").textContent = title;

      // Image de fond Hero
      const hero = document.getElementById("heroBanner");
      const poster = detail.banner || detail.image || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1000&q=80";
      hero.style.backgroundImage = `url('${poster}')`;

      // Tags métadonnées
      const tags = [];
      const score = detail.score || (detail.enriched && detail.enriched.score);
      if (score) {
        tags.push(`<span class="sf-tag-match">Recommandé à ${Math.min(99, Math.round(parseFloat(score) * 10))}%</span>`);
      } else {
        tags.push(`<span class="sf-tag-match">Recommandé à 97%</span>`);
      }

      if (detail.year) tags.push(`<span>${detail.year}</span>`);
      tags.push(`<span class="sf-tag-pill sf-tag-hd">4K Ultra HD</span>`);
      tags.push(`<span class="sf-tag-pill">5.1 Audio</span>`);

      (detail.genres || []).slice(0, 3).forEach(g => {
        tags.push(`<span class="sf-tag-pill">${g}</span>`);
      });

      document.getElementById("detailTags").innerHTML = tags.join("");

      // Synopsis
      const syn = detail.synopsis || (detail.enriched && detail.enriched.description) || "Aucun synopsis disponible.";
      document.getElementById("detailSynopsis").textContent = syn;

      // Bouton Action Principal (Lecture 1-clic)
      const actionBox = document.getElementById("heroAction");
      if (type === "movie") {
        actionBox.innerHTML = `
          <button class="sf-netflix-play-btn" id="mainPlayBtn">
            ${sfIcon("play", 20)}
            <span>Lecture</span>
          </button>
        `;
        document.getElementById("mainPlayBtn").addEventListener("click", playMovieNow);
      } else {
        const episodes = detail.episodes || [];
        if (episodes.length > 0) {
          actionBox.innerHTML = `
            <button class="sf-netflix-play-btn" id="mainPlayBtn">
              ${sfIcon("play", 20)}
              <span>Regarder Épisode 1</span>
            </button>
          `;
          document.getElementById("mainPlayBtn").addEventListener("click", () => {
            const firstEp = episodes[0];
            playEpisodeNow(firstEp.episode_id || 1, firstEp.title || "Épisode 1");
          });
        }
      }

      // Épisodes
      const episodes = detail.episodes || [];
      if (type !== "movie" && episodes.length > 0) {
        const epSec = document.getElementById("episodesSection");
        epSec.style.display = "block";
        const epList = document.getElementById("episodesList");
        epList.innerHTML = episodes.map((ep, i) => {
          const epName = ep.title || ("Épisode " + (ep.number || i + 1));
          return `
            <button class="sf-episode-card" data-epid="${ep.episode_id || (i + 1)}" data-title="${encodeURIComponent(epName)}">
              <i>${sfIcon("play", 18)}</i>
              <span class="title">${epName}</span>
              <span class="badge">HD</span>
            </button>
          `;
        }).join("");

        epList.querySelectorAll(".sf-episode-card").forEach(btn => {
          btn.addEventListener("click", () => {
            const epId = btn.dataset.epid;
            const epName = decodeURIComponent(btn.dataset.title);
            playEpisodeNow(epId, epName);
          });
        });
      }

      // Personnages & Distribution (Enrichissement public AniList / TVMaze)
      renderCharacters(detail);
    }

    async function renderCharacters(detail) {
      let chars = detail.characters || (detail.enriched && detail.enriched.characters) || [];

      // Si pas encore de personnages, interroger l'API publique d'enrichissement
      if (!chars.length) {
        try {
          const metaRes = await SyrixAuth.api(`/meta/enrich?title=${encodeURIComponent(detail.title)}&type=${encodeURIComponent(type)}`);
          if (metaRes.success && metaRes.data && metaRes.data.characters) {
            chars = metaRes.data.characters;
          }
        } catch {}
      }

      if (chars && chars.length > 0) {
        const charSec = document.getElementById("charactersSection");
        const charList = document.getElementById("charactersList");
        charSec.style.display = "block";

        charList.innerHTML = chars.map(c => `
          <div class="sf-char-card">
            <div class="sf-char-photo">
              ${c.image 
                ? `<img src="${c.image}" alt="${c.name}" onerror="this.onerror=null;this.parentElement.innerHTML=sfIcon('user', 32);" />` 
                : sfIcon('user', 32)}
            </div>
            <div class="sf-char-name">${c.name || "Personnage"}</div>
            <div class="sf-char-role">${c.actor || c.role || "Rôle"}</div>
          </div>
        `).join("");
      }
    }

    async function init() {
      if (!type || !slug) {
        document.getElementById("detailTitle").textContent = "Titre introuvable";
        return;
      }
      const res = await SyrixAuth.api("/" + routeType(type) + "/" + encodeURIComponent(slug));
      if (!res.success || !res.data) {
        document.getElementById("detailTitle").textContent = res.error?.message || "Erreur de chargement.";
        return;
      }
      renderPage(res.data);
    }
    init();
  </script>
</body>
</html>
